  <!-- Interactive Auth Guard & Notification Engine -->
  <script type="module">
    import {
      auth,
      db,
      doc,
      getDoc,
      updateDoc,
      collection,
      query,
      where,
      onSnapshot,
      onAuthStateChanged,
      getSession,
      saveSession,
      clearSession,
      ensureUserSession
    } from './js/firebase-config.js';
    import { initDrawer } from './js/drawer.js';

    const drawerController = initDrawer({ activeTabId: 'sidebarNotifItem', title: 'Notifications' });

    // DOM Elements
    const navDisplayName = document.getElementById('navDisplayName');
    const navAvatar = document.getElementById('navAvatar');
    const mobileAvatar = document.getElementById('mobileAvatar');
    const notifCardsContainer = document.getElementById('notifCardsContainer');
    const notifToast = document.getElementById('notifToast');
    const mailSearchInput = document.getElementById('mailSearchInput');
    const mailSearchClearBtn = document.getElementById('mailSearchClearBtn');
    const badgeAllMails = document.getElementById('badgeAllMails');
    const badgeInvitations = document.getElementById('badgeInvitations');

    // State Variables
    let currentUser = null;
    let currentFolder = 'invitations'; // 'all' | 'primary' | 'secondary' | 'invitations' | 'sent' | 'trash'
    let searchQuery = '';
    let allPendingInvitations = [];
    let allAcceptedInvitations = [];
    let allDeclinedInvitations = [];
    let allSentInvitations = [];
    let allDeletedInvitations = [];
    let unsubscribeInvitations = null;
    let activeReadingMailId = null;

    function mergeAndDedupeInvs(...arrays) {
      const map = new Map();
      arrays.flat().forEach(item => {
        if (!item) return;
        const key = String(item.id || `${item.confId}_${item.roleLabel}_${item.committeeCode || ''}`);
        if (!map.has(key)) {
          map.set(key, item);
        } else {
          const existing = map.get(key);
          const st = (item.status || '').toLowerCase();
          const existSt = (existing.status || '').toLowerCase();
          if (existSt === 'pending' && (st === 'accepted' || st === 'declined' || st === 'rejected' || st === 'revoked')) {
            map.set(key, item);
          }
        }
      });
      return Array.from(map.values()).sort((a, b) => {
        const timeA = new Date(a.invitedAt || a.createdAt || a.acceptedAt || a.declinedAt || 0).getTime();
        const timeB = new Date(b.invitedAt || b.createdAt || b.acceptedAt || b.declinedAt || 0).getTime();
        return timeB - timeA;
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatMailDate(timestamp) {
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const dateObj = timestamp ? new Date(timestamp) : new Date();
      const validDate = isNaN(dateObj.getTime()) ? new Date() : dateObj;

      const day = validDate.getDate();
      const month = months[validDate.getMonth()];
      const year = validDate.getFullYear();
      const hours = String(validDate.getHours()).padStart(2, '0');
      const mins = String(validDate.getMinutes()).padStart(2, '0');
      return `${day} ${month} ${year}, ${hours}:${mins}`;
    }

    function formatOrdinalDate(timestamp) {
      const months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
      const dateObj = timestamp ? new Date(timestamp) : new Date();
      const validDate = isNaN(dateObj.getTime()) ? new Date() : dateObj;

      const day = validDate.getDate();
      const month = months[validDate.getMonth()];

      let suffix = 'th';
      if (day % 10 === 1 && day !== 11) suffix = 'st';
      else if (day % 10 === 2 && day !== 12) suffix = 'nd';
      else if (day % 10 === 3 && day !== 13) suffix = 'rd';

      return `${day}${suffix} ${month}`;
    }

    function formatRelativeTime(timestamp) {
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const dateObj = timestamp ? new Date(timestamp) : new Date();
      const validDate = isNaN(dateObj.getTime()) ? new Date() : dateObj;

      const day = validDate.getDate();
      const month = months[validDate.getMonth()];
      const year = validDate.getFullYear();
      const hours = String(validDate.getHours()).padStart(2, '0');
      const mins = String(validDate.getMinutes()).padStart(2, '0');
      const datePart = `${day} ${month} ${year}, ${hours}:${mins}`;

      const now = Date.now();
      const diffSec = Math.max(0, Math.floor((now - validDate.getTime()) / 1000));
      let rel = 'Just now';
      if (diffSec < 60) {
        rel = 'Just now';
      } else if (diffSec < 3600) {
        const m = Math.floor(diffSec / 60);
        rel = `${m} ${m === 1 ? 'minute' : 'minutes'} ago`;
      } else if (diffSec < 86400) {
        const h = Math.floor(diffSec / 3600);
        rel = `${h} ${h === 1 ? 'hour' : 'hours'} ago`;
      } else {
        const d = Math.floor(diffSec / 86400);
        rel = `${d} ${d === 1 ? 'day' : 'days'} ago`;
      }

      return `${datePart} (${rel})`;
    }

    function getSenderInitials(nameOrEmail) {
      if (!nameOrEmail) return 'MU';
      const clean = String(nameOrEmail).trim();
      if (clean.includes(' ')) {
        const parts = clean.split(/\s+/);
        return ((parts[0][0] || '') + (parts[1] ? parts[1][0] : '')).toUpperCase();
      }
      return clean.slice(0, 2).toUpperCase();
    }

    function getInvitationSubject(inv) {
      if (inv.subject && inv.subject.trim()) {
        return inv.subject.replace(/official\s*/gi, '').trim();
      }
      const role = inv.roleLabel || (inv.roleType === 'secretariat' ? 'Secretariat Member' : 'Executive Member');
      const conf = inv.confTitle || inv.draftConferenceData?.title || 'Modern United Nations';
      if (inv.committeeCode) {
        return `Invitation: ${role} for ${inv.committeeCode} – ${conf}`;
      }
      return `Invitation: ${role} – ${conf}`;
    }

    function getOrganizerDisplayName(inv) {
      if (!inv) return 'vishrie';
      let org = (inv.organizerName || inv.senderName || inv.organizer || inv.institution || (inv.draftConferenceData?.institution) || '').trim();
      if (!org || org.includes('@')) {
        if (inv.organizerEmail || inv.createdByEmail) {
          const emailPrefix = (inv.organizerEmail || inv.createdByEmail).split('@')[0];
          org = emailPrefix || 'vishrie';
        } else {
          org = inv.confTitle ? `${inv.confTitle} Secretariat` : 'vishrie';
        }
      }
      return org;
    }

    function getFormalLetterContent(inv, recipientName) {
      if (inv.note && inv.note.trim().length > 20) {
        return inv.note.trim();
      }
      const roleName = inv.roleLabel || (inv.roleType === 'secretariat' ? 'Secretariat Member' : 'Executive Member');
      const commInfo = inv.committeeName ? `${inv.committeeName} (${inv.committeeCode || ''})` : (inv.committeeCode || '');
      const confTitle = inv.confTitle || inv.draftConferenceData?.title || 'Modern United Nations';
      const orgName = getOrganizerDisplayName(inv);

      let letter = `Dear ${recipientName || 'Colleague'},\n\n`;
      letter += `On behalf of the Organizing Committee of ${confTitle}, we have the distinct honour of extending to you an invitation to serve as ${roleName}${commInfo ? ` for ${commInfo}` : ''}.\n\n`;
      letter += `Your demonstrated acumen, commitment to diplomatic debate, and leadership make you an invaluable addition to our conference leadership team. As an appointed officer, you will play a key role in shaping committee deliberations, upholding parliamentary decorum, and guiding participating delegates.\n\n`;
      letter += `Kindly review the details of this appointment and confirm your acceptance or decline below at your earliest convenience.\n\n`;
      letter += `Warm regards,\n${orgName}\nOrganizing Committee, ${confTitle}`;
      return letter;
    }

    function showToast(msg, type = 'info') {
      if (!notifToast) return;
      notifToast.innerHTML = `
        <ion-icon name="${type === 'error' ? 'alert-circle-outline' : 'checkmark-circle-outline'}"></ion-icon>
        <span>${escapeHtml(msg)}</span>
      `;
      notifToast.className = `notif-toast ${type === 'error' ? 'is-error' : ''}`;
      notifToast.style.display = 'flex';
      setTimeout(() => {
        notifToast.style.display = 'none';
      }, 3000);
    }

    function renderUserData(userData) {
      if (!userData) return;
      const displayName = userData.displayName || (userData.email ? userData.email.split('@')[0] : 'Delegate');
      const initial = (displayName[0] || 'D').toUpperCase();
      const role = userData.accountType || userData.role || 'individual';
      const photoURL = userData.photoURL || userData.avatar || null;

      if (navDisplayName) navDisplayName.textContent = displayName;
      if (navAvatar) {
        if (photoURL) {
          navAvatar.innerHTML = `<img src="${photoURL}" alt="${displayName}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        } else {
          navAvatar.textContent = initial;
        }
      }
      if (mobileAvatar) {
        if (photoURL) {
          mobileAvatar.innerHTML = `<img src="${photoURL}" alt="${displayName}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        } else {
          mobileAvatar.textContent = initial;
        }
      }
      drawerController.applyRole(role);
    }

    // -------------------------------------------------------------
    // Render Mailbox Items (Inbox)
    // -------------------------------------------------------------
    // -------------------------------------------------------------
    // Minimalist Confirmation Modal Controller
    // -------------------------------------------------------------
    let pendingModalAction = null;

    function openConfirmModal(config) {
      const backdrop = document.getElementById('confirmModalBackdrop');
      const titleEl = document.getElementById('confirmModalTitle');
      const descEl = document.getElementById('confirmModalDesc');
      const confirmBtn = document.getElementById('confirmModalConfirmBtn');

      if (!backdrop || !titleEl || !descEl || !confirmBtn) return;

      titleEl.textContent = config.title || 'Confirm';
      descEl.innerHTML = config.desc || '';
      confirmBtn.textContent = config.confirmText || 'Confirm';

      if (config.isDanger) {
        confirmBtn.classList.add('is-danger');
      } else {
        confirmBtn.classList.remove('is-danger');
      }

      pendingModalAction = config.onConfirm;
      backdrop.style.display = 'flex';
      backdrop.setAttribute('aria-hidden', 'false');
    }

    function closeConfirmModal() {
      const backdrop = document.getElementById('confirmModalBackdrop');
      if (backdrop) {
        backdrop.style.display = 'none';
        backdrop.setAttribute('aria-hidden', 'true');
      }
      pendingModalAction = null;
    }

    document.getElementById('confirmModalCancelBtn')?.addEventListener('click', closeConfirmModal);
    document.getElementById('confirmModalBackdrop')?.addEventListener('click', (e) => {
      if (e.target === document.getElementById('confirmModalBackdrop')) {
        closeConfirmModal();
      }
    });
    document.getElementById('confirmModalConfirmBtn')?.addEventListener('click', () => {
      if (typeof pendingModalAction === 'function') {
        const action = pendingModalAction;
        closeConfirmModal();
        action();
      } else {
        closeConfirmModal();
      }
    });

    // -------------------------------------------------------------
    // Render Mailbox Items (Inbox)
    // -------------------------------------------------------------
    function renderMailbox() {
      if (!notifCardsContainer) return;
      const userDisplayName = currentUser?.displayName || currentUser?.name || (currentUser?.email ? currentUser.email.split('@')[0] : 'Colleague');

      // Update badge counts on folder buttons
      const pendingCount = allPendingInvitations.length;
      if (badgeInvitations) {
        badgeInvitations.textContent = String(pendingCount);
        badgeInvitations.style.display = pendingCount > 0 ? 'inline-block' : 'none';
      }
      if (badgeAllMails) {
        const totalAll = pendingCount + allAcceptedInvitations.length + allDeclinedInvitations.length + allSentInvitations.length;
        badgeAllMails.textContent = String(totalAll);
        badgeAllMails.style.display = totalAll > 0 ? 'inline-block' : 'none';
      }

      // Determine items according to active folder
      let items = [];
      if (currentFolder === 'all') {
        items = mergeAndDedupeInvs(allPendingInvitations, allAcceptedInvitations, allDeclinedInvitations, allSentInvitations);
      } else if (currentFolder === 'primary') {
        items = mergeAndDedupeInvs(allPendingInvitations, allAcceptedInvitations);
      } else if (currentFolder === 'secondary') {
        items = [];
      } else if (currentFolder === 'invitations') {
        // Show pending, accepted, and rejected/declined invitations
        items = mergeAndDedupeInvs(allPendingInvitations, allAcceptedInvitations, allDeclinedInvitations);
      } else if (currentFolder === 'sent') {
        items = [...allSentInvitations];
      } else if (currentFolder === 'trash') {
        items = mergeAndDedupeInvs(allDeletedInvitations, allDeclinedInvitations);
      }

      // Filter by Search Query
      const q = searchQuery.toLowerCase().trim();
      if (q) {
        items = items.filter(inv => {
          const org = getOrganizerDisplayName(inv).toLowerCase();
          const subj = getInvitationSubject(inv).toLowerCase();
          const conf = (inv.confTitle || inv.draftConferenceData?.title || '').toLowerCase();
          const role = (inv.roleLabel || '').toLowerCase();
          const comm = (inv.committeeName || inv.committeeCode || '').toLowerCase();
          const note = (inv.note || '').toLowerCase();
          const to = (inv.recipientName || inv.recipientEmail || '').toLowerCase();
          const st = (inv.status || '').toLowerCase();
          return org.includes(q) || subj.includes(q) || conf.includes(q) || role.includes(q) || comm.includes(q) || note.includes(q) || to.includes(q) || st.includes(q);
        });
      }

      // Check if viewing an opened mail (Reading View outside invitations)
      if (activeReadingMailId && currentFolder !== 'invitations') {
        const mail = items.find(i => String(i.id) === String(activeReadingMailId)) ||
          allPendingInvitations.find(i => String(i.id) === String(activeReadingMailId)) ||
          allAcceptedInvitations.find(i => String(i.id) === String(activeReadingMailId)) ||
          allDeclinedInvitations.find(i => String(i.id) === String(activeReadingMailId)) ||
          allSentInvitations.find(i => String(i.id) === String(activeReadingMailId)) ||
          allDeletedInvitations.find(i => String(i.id) === String(activeReadingMailId));

        if (mail) {
          renderMailReadingView(mail);
          return;
        }
      }

      // Empty State Handling
      if (items.length === 0) {
        let emptyTitle = 'No messages';
        let emptyDesc = 'Your mailbox is empty.';

        if (q) {
          emptyTitle = 'No results found';
          emptyDesc = `No messages matching "${escapeHtml(searchQuery)}".`;
        } else if (currentFolder === 'invitations') {
          emptyTitle = 'No invitations';
          emptyDesc = 'When conference secretariats appoint you to leadership roles or committees, your invitation letters will appear here.';
        } else if (currentFolder === 'primary') {
          emptyTitle = 'No primary messages';
          emptyDesc = 'Direct correspondence and appointment notices will arrive here.';
        } else if (currentFolder === 'secondary') {
          emptyTitle = 'No secondary messages';
          emptyDesc = 'Informational circulars and conference memos will appear here.';
        } else if (currentFolder === 'sent') {
          emptyTitle = 'No sent messages';
          emptyDesc = 'Invitations you dispatch to other delegates will appear here.';
        } else if (currentFolder === 'trash') {
          emptyTitle = 'Recently deleted is empty';
          emptyDesc = 'Recently declined or deleted messages will appear here.';
        }

        notifCardsContainer.innerHTML = `
          <div class="notif-empty-state">
            <h3 class="notif-empty-title">${escapeHtml(emptyTitle)}</h3>
            <p class="notif-empty-desc">${escapeHtml(emptyDesc)}</p>
          </div>
        `;
        return;
      }

      let cardsHtml = '';

      if (currentFolder === 'invitations') {
        // Invitations Folder: Simple avatar + context + Accept/Decline buttons or Accepted/Declined status
        items.forEach(inv => {
          const ordinalDate = formatOrdinalDate(inv.invitedAt || inv.createdAt || inv.sentAt || inv.declinedAt || Date.now());
          const organizer = getOrganizerDisplayName(inv);
          const roleLabel = inv.roleLabel || (inv.roleType === 'secretariat' ? 'Secretariat Member' : 'Executive Member');
          const confTitle = inv.confTitle || (inv.draftConferenceData?.title) || 'Modern United Nations';
          const commInfo = inv.committeeName ? `${inv.committeeName} (${inv.committeeCode || ''})` : (inv.committeeCode || '');
          const initials = getSenderInitials(organizer);
          const senderPhoto = inv.senderAvatar || inv.organizerAvatar;
          const confDates = inv.confDates || inv.draftConferenceData?.dates || 'Dates TBA';
          const confVenue = inv.confVenue || inv.draftConferenceData?.venue || 'Venue TBA';
          const status = (inv.status || 'pending').toLowerCase();
          const isAccepted = status === 'accepted';
          const isDeclined = status === 'declined' || status === 'rejected' || status === 'revoked';
          const avatarStatusClass = isAccepted ? 'is-accepted' : (isDeclined ? 'is-declined' : '');

          cardsHtml += `
            <article class="invitation-row" data-inv-id="${escapeHtml(inv.id)}">
              <div class="invitation-left">
                <div class="invitation-avatar ${avatarStatusClass}">
                  ${senderPhoto ? `<img src="${escapeHtml(senderPhoto)}" alt="${escapeHtml(organizer)}" onerror="this.style.display='none'; this.parentElement.textContent='${escapeHtml(initials)}';">` : escapeHtml(initials)}
                </div>
                <div class="invitation-context">
                  <div class="invitation-headline">
                    <strong>${escapeHtml(organizer)}</strong> invited you to serve as <strong>${escapeHtml(roleLabel)}</strong>${commInfo ? ` for <strong>${escapeHtml(commInfo)}</strong>` : ''} at <strong>${escapeHtml(confTitle)}</strong>
                  </div>
                  <div class="invitation-meta-line">
                    <span>${escapeHtml(confDates)}</span>
                    <span class="invitation-meta-sep">·</span>
                    <span>${escapeHtml(confVenue)}</span>
                    <span class="invitation-meta-sep">·</span>
                    <span class="invitation-date">${escapeHtml(ordinalDate)}</span>
                  </div>
                </div>
              </div>
              <div class="invitation-actions">
                ${isAccepted ? `
                  <span class="inv-status-badge is-accepted">Accepted</span>
                ` : isDeclined ? `
                  <span class="inv-status-badge is-declined">Declined</span>
                ` : `
                  <button type="button" class="inv-btn inv-btn-decline" data-inv-id="${escapeHtml(inv.id)}">
                    Decline
                  </button>
                  <button type="button" class="inv-btn inv-btn-accept" data-inv-id="${escapeHtml(inv.id)}">
                    Accept
                  </button>
                `}
              </div>
            </article>
          `;
        });
      } else {
        // ANYWHERE EXCEPT INVITATIONS (all, primary, secondary, sent, trash):
        // NO Accept/Decline buttons.
        // Serial hierarchy: Name (top, Poppins Medium), Subject (middle, Poppins Regular), Message (bottom, Poppins Thin).
        // Height of the 3 lines strictly matches the avatar height (54px).
        items.forEach(inv => {
          const ordinalDate = formatOrdinalDate(inv.invitedAt || inv.createdAt || inv.sentAt || inv.declinedAt || Date.now());
          const organizer = getOrganizerDisplayName(inv);
          const isSent = currentFolder === 'sent';
          const displayName = isSent ? (inv.recipientName || inv.recipientEmail || 'Delegate') : organizer;
          const initials = getSenderInitials(displayName);
          const avatarPhoto = isSent ? (inv.recipientAvatar || inv.avatar) : (inv.senderAvatar || inv.organizerAvatar);
          let subject = getInvitationSubject(inv).replace(/official\s*/gi, '').trim();
          const roleLabel = inv.roleLabel || (inv.roleType === 'secretariat' ? 'Secretariat Member' : 'Executive Member');
          const confTitle = inv.confTitle || (inv.draftConferenceData?.title) || 'Modern United Nations';
          const snippet = (inv.note && inv.note.trim())
            ? inv.note.trim().replace(/\n+/g, ' ')
            : (isSent ? `Invitation dispatched to ${displayName} for ${roleLabel}.` : `You are invited to serve as ${roleLabel} at ${confTitle}.`);
          const statusText = inv.status === 'accepted' ? 'Accepted' : (inv.status === 'declined' ? 'Declined' : (isSent ? 'Pending' : ''));

          cardsHtml += `
            <div
              class="mail-closed-row"
              data-mail-id="${escapeHtml(inv.id)}"
              role="button"
              tabindex="0"
              title="Open mail"
            >
              <div class="mail-closed-avatar">
                ${avatarPhoto ? `<img src="${escapeHtml(avatarPhoto)}" alt="${escapeHtml(displayName)}" onerror="this.style.display='none'; this.parentElement.textContent='${escapeHtml(initials)}';">` : escapeHtml(initials)}
              </div>
              <div class="mail-closed-text-col">
                <div class="mail-closed-line-sender">${escapeHtml(displayName)}</div>
                <div class="mail-closed-line-subject">${escapeHtml(subject)}</div>
                <div class="mail-closed-line-snippet">${escapeHtml(snippet)}</div>
              </div>
              <div class="mail-closed-right">
                <span class="mail-closed-date">${escapeHtml(ordinalDate)}</span>
                ${statusText ? `<span class="mail-closed-status">${escapeHtml(statusText)}</span>` : ''}
              </div>
            </div>
          `;
        });
      }

      notifCardsContainer.innerHTML = cardsHtml;

      // Attach Click-to-Open Handlers for mail rows (outside invitations)
      if (currentFolder !== 'invitations') {
        notifCardsContainer.querySelectorAll('.mail-closed-row').forEach(row => {
          row.addEventListener('click', () => {
            const mailId = row.getAttribute('data-mail-id');
            if (mailId) {
              activeReadingMailId = mailId;
              renderMailbox();
            }
          });
          row.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              const mailId = row.getAttribute('data-mail-id');
              if (mailId) {
                activeReadingMailId = mailId;
                renderMailbox();
              }
            }
          });
        });
      }

      // Attach Accept Handlers (Opens Confirmation Modal) - ONLY in invitations folder
      notifCardsContainer.querySelectorAll('.inv-btn-accept').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const invId = btn.getAttribute('data-inv-id');
          const targetInv = allPendingInvitations.find(i => String(i.id) === String(invId));
          if (!targetInv) return;

          const roleName = targetInv.roleLabel || 'Executive Member';
          const confName = targetInv.confTitle || targetInv.draftConferenceData?.title || 'Modern United Nations';
          const orgName = getOrganizerDisplayName(targetInv);

          openConfirmModal({
            title: 'Accept Invitation',
            desc: `You are about to accept the appointment as <strong>${escapeHtml(roleName)}</strong> for <strong>${escapeHtml(confName)}</strong> from <strong>${escapeHtml(orgName)}</strong>. This will add the conference to your dashboard.`,
            confirmText: 'Accept',
            isDanger: false,
            onConfirm: () => {
              handleAcceptInvitation(targetInv, btn);
            }
          });
        });
      });

      // Attach Decline Handlers (Opens Confirmation Modal) - ONLY in invitations folder
      notifCardsContainer.querySelectorAll('.inv-btn-decline:not(.inv-btn-delete-sent)').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const invId = btn.getAttribute('data-inv-id');
          const targetInv = allPendingInvitations.find(i => String(i.id) === String(invId));
          if (!targetInv) return;

          const roleName = targetInv.roleLabel || 'Executive Member';
          const confName = targetInv.confTitle || targetInv.draftConferenceData?.title || 'Modern United Nations';
          const orgName = getOrganizerDisplayName(targetInv);

          openConfirmModal({
            title: 'Decline Invitation',
            desc: `Are you sure you want to decline the invitation from <strong>${escapeHtml(orgName)}</strong> to serve as <strong>${escapeHtml(roleName)}</strong> for <strong>${escapeHtml(confName)}</strong>?`,
            confirmText: 'Decline',
            isDanger: true,
            onConfirm: () => {
              handleDeclineInvitation(targetInv, btn);
            }
          });
        });
      });

      // Attach Delete Sent Handlers (Opens Confirmation Modal)
      notifCardsContainer.querySelectorAll('.inv-btn-delete-sent').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const sentId = btn.getAttribute('data-sent-id');
          const targetSent = allSentInvitations.find(i => String(i.id) === String(sentId));
          const recip = targetSent ? (targetSent.recipientName || targetSent.recipientEmail || 'Delegate') : 'Delegate';

          openConfirmModal({
            title: 'Delete Sent Record',
            desc: `Are you sure you want to delete the sent invitation record for <strong>${escapeHtml(recip)}</strong>?`,
            confirmText: 'Delete',
            isDanger: true,
            onConfirm: () => {
              handleDeleteSentRecord(sentId);
            }
          });
        });
      });
    }

    // -------------------------------------------------------------
    // Accept / Decline / Delete Actions
    // -------------------------------------------------------------
    async function handleAcceptInvitation(targetInv, btn) {
      if (!targetInv || !currentUser) return;
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Accepting...';
      }

      try {
        // 1. Cloud Firestore update
        if (targetInv.id) {
          try {
            await updateDoc(doc(db, 'conferenceInvitations', targetInv.id), {
              status: 'accepted',
              acceptedAt: new Date().toISOString(),
              acceptedUid: currentUser.uid,
              acceptedEmail: currentUser.email
            });
          } catch (fsErr) {
            console.warn('Firestore accept update note:', fsErr);
          }
        }

        // 2. Local storage update
        try {
          const stored = JSON.parse(localStorage.getItem('mun_local_invitations') || '[]');
          const targetEmail = (targetInv.recipientEmail || '').trim().toLowerCase();
          const updated = stored.map(item => {
            const itemEmail = (item?.recipientEmail || '').trim().toLowerCase();
            if (item.id === targetInv.id || (item.confId === targetInv.confId && itemEmail === targetEmail && item.roleLabel === targetInv.roleLabel)) {
              return {
                ...item,
                status: 'accepted',
                acceptedAt: new Date().toISOString(),
                acceptedUid: currentUser.uid,
                acceptedEmail: currentUser.email,
                recipientName: currentUser.displayName || item.recipientName,
                recipientAvatar: currentUser.photoURL || item.recipientAvatar
              };
            }
            return item;
          });
          localStorage.setItem('mun_local_invitations', JSON.stringify(updated));
        } catch (e) { }

        // 3. Add to accepted conferences so it shows up in "Your Conferences"
        const draftConf = targetInv.draftConferenceData || {};
        const acceptedConf = {
          id: targetInv.confId || `conf_${Date.now()}`,
          title: targetInv.confTitle || draftConf.title || 'Model United Nations',
          institution: draftConf.institution || targetInv.organizer || 'MUN Secretariat',
          dates: targetInv.confDates || draftConf.dates || 'Dates TBA',
          venue: targetInv.confVenue || draftConf.venue || 'Venue TBA',
          logoUrl: draftConf.logoUrl || '',
          format: draftConf.format || 'in-person',
          isDraft: true,
          status: 'draft',
          acceptedRole: {
            roleLabel: targetInv.roleLabel,
            roleType: targetInv.roleType,
            committeeCode: targetInv.committeeCode || null,
            committeeName: targetInv.committeeName || null
          },
          committees: draftConf.committees || (targetInv.committeeCode ? [targetInv.committeeCode] : []),
          description: draftConf.description || '',
          acceptedAt: new Date().toISOString()
        };

        try {
          const raw = localStorage.getItem('mun_accepted_conferences');
          const list = raw ? JSON.parse(raw) : [];
          const filtered = list.filter(c => c.id !== acceptedConf.id);
          filtered.unshift(acceptedConf);
          localStorage.setItem('mun_accepted_conferences', JSON.stringify(filtered));
        } catch (e) { }

        // 4. Broadcast update across all open tabs
        try {
          const bc = new BroadcastChannel('mun_invitations_channel');
          bc.postMessage({ action: 'accepted', invId: targetInv.id });
          setTimeout(() => { try { bc.close(); } catch (e) { } }, 2000);
        } catch (e) { }

        showToast('Appointment accepted! Conference added to Your Conferences.');
        const acceptedRecord = { ...targetInv, status: 'accepted', acceptedAt: new Date().toISOString() };
        allPendingInvitations = allPendingInvitations.filter(i => String(i.id) !== String(targetInv.id));
        allAcceptedInvitations = allAcceptedInvitations.filter(i => String(i.id) !== String(targetInv.id));
        allAcceptedInvitations.unshift(acceptedRecord);
        renderMailbox();

        if (typeof window.munUpdateNotificationBadges === 'function') {
          window.munUpdateNotificationBadges();
        }
      } catch (err) {
        console.error('Accept appointment error:', err);
        showToast('Could not accept appointment.', 'error');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Accept';
        }
      }
    }

    async function handleDeclineInvitation(targetInv, btn) {
      if (!targetInv) return;
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Declining...';
      }

      try {
        if (targetInv.id) {
          try {
            await updateDoc(doc(db, 'conferenceInvitations', targetInv.id), {
              status: 'declined',
              declinedAt: new Date().toISOString()
            });
          } catch (fsErr) {
            console.warn('Firestore decline update note:', fsErr);
          }
        }

        try {
          const stored = JSON.parse(localStorage.getItem('mun_local_invitations') || '[]');
          const targetEmail = (targetInv.recipientEmail || '').trim().toLowerCase();
          const updated = stored.map(item => {
            const itemEmail = (item?.recipientEmail || '').trim().toLowerCase();
            if (item.id === targetInv.id || (item.confId === targetInv.confId && itemEmail === targetEmail && item.roleLabel === targetInv.roleLabel)) {
              return { ...item, status: 'declined', declinedAt: new Date().toISOString() };
            }
            return item;
          });
          localStorage.setItem('mun_local_invitations', JSON.stringify(updated));
        } catch (e) { }

        try {
          const bc = new BroadcastChannel('mun_invitations_channel');
          bc.postMessage({ action: 'declined', invId: targetInv.id, confId: targetInv.confId, recipientEmail: targetInv.recipientEmail });
          setTimeout(() => { try { bc.close(); } catch (e) { } }, 2000);
        } catch (e) { }
        window.dispatchEvent(new CustomEvent('mun:invitation-dispatched', { detail: { action: 'declined', invId: targetInv.id, confId: targetInv.confId, recipientEmail: targetInv.recipientEmail } }));

        showToast('Invitation declined.');
        const declinedRecord = { ...targetInv, status: 'declined', declinedAt: new Date().toISOString() };
        allDeletedInvitations.unshift(declinedRecord);
        try {
          localStorage.setItem('mun_deleted_invitations', JSON.stringify(allDeletedInvitations));
        } catch (e) { }
        allPendingInvitations = allPendingInvitations.filter(i => String(i.id) !== String(targetInv.id));
        allDeclinedInvitations = allDeclinedInvitations.filter(i => String(i.id) !== String(targetInv.id));
        allDeclinedInvitations.unshift(declinedRecord);
        renderMailbox();

        if (typeof window.munUpdateNotificationBadges === 'function') {
          window.munUpdateNotificationBadges();
        }
      } catch (err) {
        console.error('Decline invitation error:', err);
        showToast('Could not decline invitation.', 'error');
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Decline';
        }
      }
    }

    function handleDeleteSentRecord(sentId) {
      if (!sentId) return;
      try {
        const stored = JSON.parse(localStorage.getItem('mun_local_invitations') || '[]');
        const updated = stored.filter(i => String(i.id) !== String(sentId));
        localStorage.setItem('mun_local_invitations', JSON.stringify(updated));
        const rec = allSentInvitations.find(i => String(i.id) === String(sentId));
        if (rec) {
          allDeletedInvitations.unshift({ ...rec, status: 'deleted', deletedAt: new Date().toISOString() });
          try {
            localStorage.setItem('mun_deleted_invitations', JSON.stringify(allDeletedInvitations));
          } catch (e) { }
        }
        allSentInvitations = allSentInvitations.filter(i => String(i.id) !== String(sentId));
        renderMailbox();
        showToast('Sent record deleted.');
      } catch (e) {
        showToast('Could not delete record.', 'error');
      }
    }

    // -------------------------------------------------------------
    // Data Loading & Real-time Listeners
    // -------------------------------------------------------------
    function loadNotificationsData(user) {
      if (!user || !user.email) return;
      const userEmail = user.email.toLowerCase().trim();

      // 1. Instant local load
      try {
        const local = JSON.parse(localStorage.getItem('mun_local_invitations') || '[]');
        allPendingInvitations = local.filter(i =>
          i && (i.recipientEmail || '').toLowerCase().trim() === userEmail && (!i.status || i.status === 'pending')
        ).map(i => ({ ...i, _source: 'local' }));

        allAcceptedInvitations = local.filter(i =>
          i && (i.recipientEmail || '').toLowerCase().trim() === userEmail && i.status === 'accepted'
        ).map(i => ({ ...i, _source: 'local' }));

        allDeclinedInvitations = local.filter(i =>
          i && (i.recipientEmail || '').toLowerCase().trim() === userEmail && (i.status === 'declined' || i.status === 'rejected' || i.status === 'revoked')
        ).map(i => ({ ...i, _source: 'local' }));

        allSentInvitations = local.filter(i =>
          i && ((i.organizerEmail || '').toLowerCase().trim() === userEmail || (user.uid && (i.organizerUid === user.uid || i.createdBy === user.uid)))
        );

        try {
          allDeletedInvitations = JSON.parse(localStorage.getItem('mun_deleted_invitations') || '[]');
          allDeletedInvitations.forEach(del => {
            if (del && (del.status === 'declined' || del.status === 'rejected')) {
              const exists = allDeclinedInvitations.some(d => String(d.id) === String(del.id));
              if (!exists) allDeclinedInvitations.push(del);
            }
          });
        } catch (e) {
          allDeletedInvitations = [];
        }

        renderMailbox();
      } catch (e) { }

      // 2. Real-time Firestore sync on conferenceInvitations
      try {
        if (unsubscribeInvitations) {
          unsubscribeInvitations();
          unsubscribeInvitations = null;
        }

        const invQuery = query(
          collection(db, 'conferenceInvitations'),
          where('recipientEmail', '==', userEmail)
        );

        unsubscribeInvitations = onSnapshot(invQuery, (snapshot) => {
          const firestorePending = [];
          const firestoreAccepted = [];
          const firestoreDeclined = [];

          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const invObj = { id: docSnap.id, ...data, _source: 'firestore' };
            const st = (invObj.status || 'pending').toLowerCase();
            if (st === 'accepted') {
              firestoreAccepted.push(invObj);
            } else if (st === 'declined' || st === 'rejected' || st === 'revoked') {
              firestoreDeclined.push(invObj);
            } else {
              firestorePending.push(invObj);
            }
          });

          let localInvs = [];
          try {
            const stored = JSON.parse(localStorage.getItem('mun_local_invitations') || '[]');
            localInvs = stored.filter(item =>
              item && (item.recipientEmail || '').toLowerCase().trim() === userEmail
            ).map(item => ({ ...item, _source: 'local' }));
          } catch (e) { }

          const localPending = localInvs.filter(i => (!i.status || i.status === 'pending'));
          const localAccepted = localInvs.filter(i => i.status === 'accepted');
          const localDeclined = localInvs.filter(i => (i.status === 'declined' || i.status === 'rejected' || i.status === 'revoked'));

          allPendingInvitations = mergeAndDedupeInvs(firestorePending, localPending);
          allAcceptedInvitations = mergeAndDedupeInvs(firestoreAccepted, localAccepted);
          allDeclinedInvitations = mergeAndDedupeInvs(firestoreDeclined, localDeclined, allDeletedInvitations);
          renderMailbox();
        }, (err) => {
          console.warn('Notifications snapshot notice:', err);
        });
      } catch (err) {
        console.warn('Notifications query setup notice:', err);
      }
    }

    // -------------------------------------------------------------
    // Folder Navigation & Real-time Search Listeners
    // -------------------------------------------------------------
    document.querySelectorAll('.mail-folder-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const folder = btn.getAttribute('data-folder');
        if (!folder) return;
        activeReadingMailId = null;
        currentFolder = folder;
        document.querySelectorAll('.mail-folder-btn').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        renderMailbox();
      });
    });

    mailSearchInput?.addEventListener('input', (e) => {
      activeReadingMailId = null;
      searchQuery = e.target.value;
      if (mailSearchClearBtn) {
        mailSearchClearBtn.style.display = searchQuery ? 'flex' : 'none';
      }
      renderMailbox();
    });

    mailSearchClearBtn?.addEventListener('click', () => {
      activeReadingMailId = null;
      searchQuery = '';
      if (mailSearchInput) {
        mailSearchInput.value = '';
        mailSearchInput.focus();
      }
      mailSearchClearBtn.style.display = 'none';
      renderMailbox();
    });

    // Cross-tab synchronization
    window.addEventListener('storage', (e) => {
      if (e.key && (e.key.startsWith('mun_') || e.key === 'mun_local_invitations')) {
        if (currentUser) loadNotificationsData(currentUser);
      }
    });

    try {
      const bc = new BroadcastChannel('mun_invitations_channel');
      bc.onmessage = () => {
        if (currentUser) loadNotificationsData(currentUser);
      };
    } catch (e) { }

    // -------------------------------------------------------------
    // Auth Guard & Initialization
    // -------------------------------------------------------------
    const initialSession = getSession();
    if (initialSession && initialSession.uid) {
      currentUser = initialSession;
      renderUserData(initialSession);
      if (initialSession.email) {
        loadNotificationsData(initialSession);
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        if (localStorage.getItem('mun_demo_mode') === 'true' && currentUser) {
          return;
        }
        if (unsubscribeInvitations) { unsubscribeInvitations(); unsubscribeInvitations = null; }
        clearSession();
        window.location.href = 'signin.html';
        return;
      }

      try {
        const session = await ensureUserSession(auth, db, user, getDoc, doc);
        if (!session || !session.isProfileComplete) {
          window.location.href = 'onboarding.html';
          return;
        }

        currentUser = session || user;
        renderUserData(session);
        if (drawerController && typeof drawerController.syncUser === 'function') {
          drawerController.syncUser(session, session.accountType || session.role || 'individual');
        }
        await saveSession(user, session).catch(() => { });

        loadNotificationsData(currentUser);
      } catch (err) {
        console.warn('Session verification notice:', err);
      }
    });
  </script>
</body>
